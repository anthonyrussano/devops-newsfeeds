name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.19'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked pytest -q

  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [cli, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile-${{ matrix.variant }}
          load: true
          tags: devops-newsfeeds:${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - if: matrix.variant == 'cli'
        run: |
          docker run --rm devops-newsfeeds:cli --version
          docker run --rm devops-newsfeeds:cli -x print-unread
      - if: matrix.variant == 'web'
        run: |
          docker compose up -d --no-build --wait --wait-timeout 60
          curl --fail http://127.0.0.1:8080/ -o /dev/null
      - if: matrix.variant == 'web'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.19'
      - if: matrix.variant == 'web'
        run: |
          uv sync --locked --group browser
          uv run --locked --group browser playwright install --with-deps chromium
          uv run --locked --group browser python scripts/browser_smoke.py
          uv run --locked --group browser python scripts/curation_smoke.py
      - if: always() && matrix.variant == 'web'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screenshots
          path: .cache/browser/
          if-no-files-found: ignore
      - if: always() && matrix.variant == 'web'
        run: docker compose logs && docker compose down

  publish:
    needs: [python, containers]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit
