services:
  devops-newsfeed:
    build:
      context: .
      dockerfile: Dockerfile-web
    image: devops-newsfeeds:web
    ports:
      - "127.0.0.1:8080:7681"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
